##########################################################
#
#           服务器配置
#
##########################################################
server.port=8888
spring.application.name=yunshu-nas
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
##########################################################
#
#           日志配置
#
##########################################################
logging.level.top=debug

##########################################################
#
#           转码队列的 MQ 实现（可选）
#
##########################################################
# 默认关闭：转码任务走进程内的有界队列 + 线程池。
# 置为 true 后改为投递到 RabbitMQ，由消费者转码 —— 带来任务持久化（重启不丢）、
# 失败死信、以及多实例共享任务队列。关闭时不会声明任何队列、也不会建立连接。
nas.mq.enabled=false
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
